<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NutriBot – Aprender a Comer com Saúde: aplicação de educação alimentar para o 4.º ano do Ensino Básico.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%229%22%20y%3D%2214%22%20width%3D%2246%22%20height%3D%2238%22%20rx%3D%2215%22%20fill%3D%22%232e9d5b%22/%3E%3Crect%20x%3D%2215%22%20y%3D%2221%22%20width%3D%2234%22%20height%3D%2223%22%20rx%3D%2210%22%20fill%3D%22%23eafbf0%22/%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2231%22%20r%3D%223.6%22%20fill%3D%22%2315301f%22/%3E%3Ccircle%20cx%3D%2239%22%20cy%3D%2231%22%20r%3D%223.6%22%20fill%3D%22%2315301f%22/%3E%3Cpath%20d%3D%22M27%2037.5c3%202.6%207%202.6%2010%200%22%20stroke%3D%22%2315301f%22%20stroke-width%3D%222.4%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M32%2014V8%22%20stroke%3D%22%231d6b3f%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M32%208c1-4%205-6%209-5-1%204-5%206-9%205z%22%20fill%3D%22%236cc46a%22/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}</style>
<title>NutriBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
:root{
  /* Layout: caderno quadriculado do 1.º ciclo — coluna de app até 1040px, cartões sobre a grelha, cores dos 7 grupos da Roda dos Alimentos */
  --paper:#f5f8fc;
  --grid:rgba(66,128,200,.10);
  --surface:#ffffff;
  --surface-2:#edf2f9;
  --ink:#1b2747;
  --ink-soft:#56617e;
  --line:#d3dcea;
  --bot:#23854d;
  --btn-bg:#1f7a46;
  --btn-fg:#ffffff;
  --user-bg:#dbe8fa;
  --focus:#2f7fd0;
  --ok:#1b7a42;
  --ok-bg:#e1f3e7;
  --no:#b5372b;
  --no-bg:#fbe6e2;
  --tip-bg:#fff3d1;
  --tip-line:#e2b93e;
  --icon-line:rgba(27,39,71,.5);
  --g-cereais:#d4952b;
  --g-horticolas:#3d9a4b;
  --g-fruta:#e25a3c;
  --g-laticinios:#3f86d4;
  --g-proteina:#b2477a;
  --g-leguminosas:#8a6a3d;
  --g-gorduras:#e0b928;
  --g-agua:#4fbcd6;
  --sc-wall:#e6f0fb;
  --sc-tile:rgba(66,128,200,.14);
  --sc-top:#d3ad7f;
  --sc-counter:#f3e6d3;
  --sc-line:rgba(130,95,55,.30);
  --sc-line2:#9fb3cc;
  --sc-wood:#b98a5a;
  --sc-clock:#ffffff;
  --sc-bubble:#ffffff;
  --sc-steam:rgba(110,130,160,.7);
  --f-display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1729;--grid:rgba(120,165,230,.07);--surface:#17213a;--surface-2:#1f2b48;--ink:#ecf1fa;--ink-soft:#a6b2cc;--line:#2d3a5a;
    --bot:#4cc47f;--btn-bg:#4cc47f;--btn-fg:#0a1b11;--user-bg:#24406b;--focus:#7db7f2;
    --ok:#62d391;--ok-bg:rgba(98,211,145,.14);--no:#ff8f7f;--no-bg:rgba(255,143,127,.13);--tip-bg:rgba(226,185,62,.12);--tip-line:#a88a2e;
    --icon-line:rgba(236,241,250,.55);
    --sc-wall:#15223a;--sc-tile:rgba(140,180,240,.08);--sc-top:#8a6a48;--sc-counter:#2e2a26;--sc-line:rgba(255,225,180,.16);--sc-line2:#55688c;--sc-wood:#8a6a48;--sc-clock:#e8eef8;--sc-bubble:#22304d;--sc-steam:rgba(225,235,250,.65);
    --g-cereais:#e3a940;--g-horticolas:#55b563;--g-fruta:#f06e50;--g-laticinios:#5d9ee6;--g-proteina:#cf6597;--g-leguminosas:#ad8a58;--g-gorduras:#ecc83c;--g-agua:#5fcbe3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1729;--grid:rgba(120,165,230,.07);--surface:#17213a;--surface-2:#1f2b48;--ink:#ecf1fa;--ink-soft:#a6b2cc;--line:#2d3a5a;
  --bot:#4cc47f;--btn-bg:#4cc47f;--btn-fg:#0a1b11;--user-bg:#24406b;--focus:#7db7f2;
  --ok:#62d391;--ok-bg:rgba(98,211,145,.14);--no:#ff8f7f;--no-bg:rgba(255,143,127,.13);--tip-bg:rgba(226,185,62,.12);--tip-line:#a88a2e;
  --icon-line:rgba(236,241,250,.55);
  --sc-wall:#15223a;--sc-tile:rgba(140,180,240,.08);--sc-top:#8a6a48;--sc-counter:#2e2a26;--sc-line:rgba(255,225,180,.16);--sc-line2:#55688c;--sc-wood:#8a6a48;--sc-clock:#e8eef8;--sc-bubble:#22304d;--sc-steam:rgba(225,235,250,.65);
  --g-cereais:#e3a940;--g-horticolas:#55b563;--g-fruta:#f06e50;--g-laticinios:#5d9ee6;--g-proteina:#cf6597;--g-leguminosas:#ad8a58;--g-gorduras:#ecc83c;--g-agua:#5fcbe3;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
html.big{font-size:19px}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.55;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus{outline:none}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}

/* Cabeçalho */
.top{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:22px;border-bottom:2px dashed var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;border-radius:14px;text-align:left}
.brand svg{width:46px;height:46px;flex:none;display:block}
.brand b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1}
.brand small{display:block;color:var(--ink-soft);font-size:.85rem;margin-top:3px}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;font-size:1rem;padding:0}
.pip svg{width:18px;height:18px}
.pip.done{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.pip.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface-2)}
.aa{height:38px;min-width:44px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800}
.aa[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Botões comuns */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.2;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:40px;padding:6px 16px;font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.link{align-self:flex-start;background:none;border:0;padding:4px 0;text-decoration:underline;text-underline-offset:3px;color:var(--ink-soft);font-weight:700}
.link.armed{color:var(--no)}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-soft);padding:0}
.say svg{width:20px;height:20px}
.say:hover{color:var(--ink);border-color:var(--ink-soft)}

/* Início */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-bottom:28px}
.hero-bot svg{width:clamp(84px,16vw,132px);height:auto;display:block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.speech{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 20px;font-size:1.2rem;display:flex;gap:12px;align-items:flex-start}
.speech::before{content:"";position:absolute;left:-11px;top:50%;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.speech p{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.tiles{grid-template-columns:minmax(0,1fr)}.speech{font-size:1.05rem}}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"icon text" "icon stat";gap:4px 14px;align-items:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--t)}
.tile.next{border-color:var(--t);box-shadow:0 5px 0 0 var(--t)}
.ticon{grid-area:icon;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,var(--surface));color:var(--t)}
.ticon svg{width:30px;height:30px}
.ttext{grid-area:text;display:flex;flex-direction:column;gap:2px;min-width:0}
.ttext small{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
.ttext b{font-family:var(--f-display);font-size:1.35rem;line-height:1.15}
.ttext span{color:var(--ink-soft)}
.tstat{grid-area:stat;justify-self:start;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;padding:4px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);margin-top:8px}
.tile.done .tstat{background:var(--ok-bg);color:var(--ok)}
.tile.next .tstat{background:var(--btn-bg);color:var(--btn-fg)}
.tstat svg{width:16px;height:16px}
.foot{margin-top:28px;padding:16px 18px;border-radius:18px;background:var(--tip-bg);border:2px dashed var(--tip-line);display:flex;flex-direction:column;gap:10px;font-size:.95rem;max-width:80ch}

/* Cabeçalho das etapas */
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;min-height:40px}
.back svg{width:18px;height:18px}
.kicker{display:block;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.vhead h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.lede{max-width:65ch;color:var(--ink-soft);margin:-4px 0 18px}

/* Quiz */
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,32px);max-width:760px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--ink-soft);font-size:.92rem;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--surface-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.bar{height:10px;border-radius:999px;background:var(--surface-2);margin:10px 0 20px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--btn-bg);border-radius:inherit;transition:width .4s}
.qrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.qrow h2{flex:1;min-width:0;font-size:clamp(1.3rem,3vw,1.6rem)}
.hint{color:var(--ink-soft);margin:-8px 0 14px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.opts.two{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1.35;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:800}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt.check .cbox{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.opt.check .cbox svg{width:16px;height:16px;opacity:0}
.opt.check[aria-pressed="true"] .cbox{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.check[aria-pressed="true"] .cbox svg{opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .key,.opt.right .cbox{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .key,.opt.wrong .cbox{background:var(--no);border-color:var(--no);color:var(--surface)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px}
.fb.good{background:var(--ok-bg)}
.fb.bad{background:var(--no-bg)}
.fb b{font-family:var(--f-display)}
.score{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);margin-bottom:4px}
.score b{font-size:clamp(3.4rem,10vw,5rem);line-height:1;font-weight:800;color:var(--bot);font-variant-numeric:tabular-nums}
.score span{font-size:1.25rem;color:var(--ink-soft);font-weight:600}
.mt{margin-top:8px}
.concepts{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.concepts li{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-weight:700}
.concepts li svg{width:18px;height:18px;flex:none}
.concepts .ok svg{color:var(--ok)}
.concepts .no svg{color:var(--no)}

/* Pergunta ao NutriBot */
.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--surface);border:2px solid var(--line);border-radius:16px}
.dots{display:flex;gap:6px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--bot)}
.dots span.on{background:var(--bot)}
.meter p{font-weight:700;flex:1;min-width:14ch}
.chatwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.chatwrap{grid-template-columns:minmax(0,1fr)}}
.chat{background:var(--surface);border:2px solid var(--line);border-radius:24px;display:flex;flex-direction:column;height:min(70vh,640px);min-height:380px;overflow:hidden}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%}
.msg.user{align-self:flex-end;background:var(--user-bg);padding:10px 14px;border-radius:18px 18px 6px 18px;font-weight:700;overflow-wrap:anywhere}
.msg.bot{display:flex;gap:8px;align-items:flex-start}
.ava{flex:none}
.ava svg{width:32px;height:32px;display:block}
.bubble{background:var(--surface-2);padding:12px 14px;border-radius:6px 18px 18px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.btag{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--bot)}
.bubble .lead{font-size:.92rem;color:var(--ink-soft)}
.bubble .say{width:34px;height:34px;align-self:flex-end}
.bubble .say svg{width:17px;height:17px}
.typing{flex-direction:row;gap:5px;padding:16px 16px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{display:flex;gap:8px;padding:12px;border-top:2px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.picker{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px}
.picker h2{font-size:1.2rem;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;min-height:36px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:.9rem;font-weight:700;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:440px;overflow-y:auto;padding-right:4px}
@media (max-width:820px){.qlist{max-height:none;overflow:visible}}
.qbtn{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;line-height:1.35}
.qbtn:hover{border-color:var(--bot)}
.qbtn .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.qbtn.seen .mk{background:var(--bot);border-color:var(--bot);color:var(--surface)}
.qbtn .mk svg{width:13px;height:13px}
.note{font-size:.88rem;color:var(--ink-soft);margin-top:12px}

/* Constrói o teu lanche */
.lanche{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:860px){.lanche{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.box h2{font-size:1.25rem;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.count{font-family:var(--f-body);font-size:.95rem;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;min-width:50px;padding:4px 6px;border-radius:14px;border:2px dashed var(--line);color:var(--ink-soft);font-family:var(--f-display);font-size:1.3rem}
.slot.full{border-style:solid;background:var(--surface-2);font-family:var(--f-body);font-size:1rem}
.slot .fi{width:34px;height:34px;flex:none}
.slot .nm{font-weight:700;font-size:.9rem;color:var(--ink)}
.rm{width:28px;height:28px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-soft);padding:0}
.rm:hover{background:var(--no-bg);color:var(--no)}
.rm svg{width:14px;height:14px}
.lnote{margin-top:10px;font-weight:700;color:var(--no)}
.wheelrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:18px 0 6px}
.wheel{width:168px;max-width:100%;flex:none}
.wheel svg{width:100%;height:auto;display:block}
.seg{opacity:.16;transition:opacity .35s}
.seg.on{opacity:1}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:3px;flex:1;min-width:180px;font-size:.92rem}
.legend li{display:flex;align-items:center;gap:8px;color:var(--ink-soft)}
.legend li.on{color:var(--ink);font-weight:700}
.sw{width:12px;height:12px;border-radius:4px;flex:none;opacity:.35}
.legend li.on .sw{opacity:1}
.legend .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:400;color:var(--ink-soft)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.checks .ck{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);margin-top:1px}
.checks .ck svg{width:13px;height:13px}
.checks li.ok{background:var(--ok-bg)}
.checks li.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.checks li.warn{background:var(--no-bg)}
.checks li.warn .ck{background:var(--no);border-color:var(--no);color:var(--surface)}
.checks small{display:block;color:var(--ink-soft);font-size:.88rem;margin-top:1px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.food{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;line-height:1.2;text-align:center;transition:transform .12s,border-color .12s}
.food .fi{width:52px;height:52px}

.tick svg{width:13px;height:13px}
.fi .ln{stroke:var(--icon-line);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.just{margin-top:18px}
.just .lede{margin:0 0 14px}
.jrows{display:grid;gap:10px}
.jrow{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:8px 14px;align-items:start;padding:12px;border-radius:16px;background:var(--surface-2)}
.jfood{display:flex;align-items:center;gap:8px;font-weight:700}
.jfood .fi{width:38px;height:38px;flex:none}
.jopts{display:flex;flex-wrap:wrap;gap:6px}
.jopts .chip.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.jopts .chip.wrong{background:var(--no-bg);border-color:var(--no);color:var(--ink)}
.jfb{grid-column:2;font-size:.94rem;display:flex;gap:6px;align-items:flex-start}
.jfb svg{width:16px;height:16px;flex:none;margin-top:3px}
.jfb.good{color:var(--ok)}
.jfb.bad{color:var(--no)}
@media (max-width:620px){.jrow{grid-template-columns:minmax(0,1fr)}.jfb{grid-column:1}}
.jfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.win{margin-top:16px;padding:16px;border-radius:18px;background:var(--ok-bg);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.win > svg{width:56px;height:56px;flex:none}
.win > div{flex:1;min-width:16ch}
.win b{font-family:var(--f-display);font-size:1.2rem}

/* Avaliação final */
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 26px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;line-height:1.25;text-align:center}
.face svg{width:52px;height:52px}
.face[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}

.cmp{display:grid;gap:8px;margin-top:16px}
.cmp .row{display:grid;grid-template-columns:7em minmax(0,1fr) 2.6em;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}

.objs li::before{counter-increment:o;content:counter(o);width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}

/* Extras na página inicial */

.tile.extra{border-style:dashed}

.more{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-weight:700;color:var(--ink-soft)}

/* Festa de anos saudável */

.psec{display:flex;flex-direction:column;gap:10px}

.psec h2{font-size:1.45rem;display:flex;align-items:center;gap:10px}
.psec h2::before{content:"";width:16px;height:16px;border-radius:6px;background:var(--c);flex:none}
.psec .sub{color:var(--ink-soft);margin-bottom:4px}

.pcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;transition:border-color .15s,box-shadow .15s}

.ptop b{display:block;font-family:var(--f-display);font-size:1.12rem;line-height:1.2}

.pcard details{border-top:2px dashed var(--line);padding-top:8px}

.pcard summary::-webkit-details-marker{display:none}
.pcard summary::before{content:"+";width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--ink)}
.pcard details[open] summary::before{content:"−"}
.pcard ol{margin:6px 0 0;padding-left:1.25em;display:grid;gap:5px;font-size:.95rem;line-height:1.45}
.pcard details .link{display:block;margin-top:6px}
.pbtn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-family:var(--f-display)}
.pbtn:hover{border-color:var(--btn-bg)}
.pbtn svg{width:16px;height:16px}
.pbtn[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.plan{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}

.plist{list-style:none;padding:0;margin:0 0 4px;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:.95rem;line-height:1.25}
.plist .fi{width:30px;height:30px;flex:none}
.plist li span{flex:1;min-width:0}
.pempty{color:var(--ink-soft);margin-bottom:4px}
.tips{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* Bolo de caneca do Chef NutriBot */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.meta span{padding:4px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:.9rem}
.ckwrap{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.ckwrap{grid-template-columns:minmax(0,1fr)}}
.scenebox{border:2px solid var(--line);border-radius:24px;overflow:hidden;background:var(--sc-wall)}
.scene{display:block;width:100%;height:auto}
.scene .only{display:none}
.scene[data-step="1"] .s1,.scene[data-step="2"] .s2,.scene[data-step="3"] .s3,.scene[data-step="4"] .s4,.scene[data-step="5"] .s5,.scene[data-step="6"] .s6,.scene[data-step="7"] .s7{display:inline}
.scene[data-step="7"] .not7{display:none}
.scene .arm{fill:none;stroke:#1d6b3f;stroke-width:13;stroke-linecap:round}
.scene .hand{fill:#2e9d5b;stroke:#1d6b3f;stroke-width:3}
.scene .bot{animation:bob2 3s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-3px)}}
.scene .eyes{transform-box:fill-box;transform-origin:center;animation:blinky 4.5s infinite}
@keyframes blinky{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.scene .rub,.scene .point{transform-origin:226px 198px;animation:rub .5s ease-in-out infinite alternate}
.scene .point{animation-duration:.9s}
@keyframes rub{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.scene .wave{transform-origin:174px 198px;animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.scene .mash{animation:mash .6s ease-in-out infinite}
@keyframes mash{50%{transform:translateY(12px)}}
.scene .shellL{transform-box:fill-box;transform-origin:100% 50%;animation:shellL 2.4s ease-in-out infinite}
.scene .shellR{transform-box:fill-box;transform-origin:0 50%;animation:shellR 2.4s ease-in-out infinite}
@keyframes shellL{0%,28%,92%,100%{transform:none}40%,80%{transform:translateX(-7px) rotate(-24deg)}}
@keyframes shellR{0%,28%,92%,100%{transform:none}40%,80%{transform:translateX(7px) rotate(24deg)}}
.scene .yolk{animation:yolk 2.4s ease-in infinite}
@keyframes yolk{0%,36%{transform:translateY(0);opacity:0}42%{transform:translateY(0);opacity:1}72%{transform:translateY(34px);opacity:1}76%,100%{transform:translateY(36px);opacity:0}}
.scene .pour{transform-origin:226px 196px;animation:pour 1.4s ease-in-out infinite alternate}
@keyframes pour{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.scene .flake{animation:fall 1.2s linear infinite}
@keyframes fall{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(26px);opacity:1}}
.scene .fan{transform-origin:226px 196px;animation:fan .4s ease-in-out infinite alternate}
@keyframes fan{from{transform:rotate(-10deg)}to{transform:rotate(9deg)}}
.scene .cheerR{transform-origin:226px 196px;animation:cheerR .55s ease-in-out infinite alternate}
.scene .cheerL{transform-origin:174px 196px;animation:cheerL .55s ease-in-out infinite alternate}
@keyframes cheerR{to{transform:rotate(9deg)}}
@keyframes cheerL{to{transform:rotate(-9deg)}}
.scene .flow{stroke-dasharray:8 6;animation:flow .45s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.scene .bub{transform-box:fill-box;transform-origin:center;animation:bub 2.2s ease-out infinite}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-56px) scale(1.1);opacity:0}}
.scene .steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.95}100%{transform:translateY(-18px);opacity:0}}
.scene .hg{transform-box:fill-box;transform-origin:center;animation:hg 4s ease-in-out infinite}
@keyframes hg{0%,76%{transform:rotate(0)}92%,100%{transform:rotate(180deg)}}
.scene .drop{animation:drop .55s cubic-bezier(.3,1.5,.6,1) both}
@keyframes drop{from{transform:translateY(-36px);opacity:0}to{transform:none;opacity:1}}
.scene .spark{transform-box:fill-box;transform-origin:center;animation:spark 1.6s ease-in-out infinite}

.scene .glow{opacity:0}
.scene.running .glow{animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.2}to{opacity:.55}}
#mwDome{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.12)}
.stepcard{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px clamp(16px,3vw,24px)}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.adult{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--tip-bg);border:2px solid var(--tip-line);font-weight:700;font-size:.88rem}
.adult svg{width:16px;height:16px}
.stepcard .qrow{margin:8px 0}
.stepcard p{font-size:1.12rem;max-width:62ch}
.mw{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px}
.mw .note{margin:0;flex:1;min-width:22ch;font-size:.92rem}
.cknav{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}

.ckdot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:.9rem;display:grid;place-items:center;padding:0}
.ckdot.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.ckdot.cur{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}

.recipe h3{font-size:1.05rem;margin:18px 0 6px}
.hint2{color:var(--ink-soft);font-size:.92rem;margin:-6px 0 10px}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ingb{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 10px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);line-height:1.3;font-size:.98rem}

.ingb[aria-pressed="true"] .cbox{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ingb[aria-pressed="true"] .cbox svg{opacity:1}
.tools{color:var(--ink-soft);line-height:1.5}
.warn{margin-top:16px;padding:12px 14px;border-radius:16px;background:var(--tip-bg);border:2px dashed var(--tip-line)}
.warn ul{margin:6px 0 0;padding-left:1.15em;display:grid;gap:5px;font-size:.95rem}
.vars{margin-top:18px}
.vlist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.vlist li{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface-2)}
.vlist .fi{width:42px;height:42px;flex:none}
.vlist span{min-width:0}
.vlist b{display:block;font-family:var(--f-display);font-size:1.05rem}
.vlist .link{display:inline;margin-left:2px}

/* Pergunta com imagens */
.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt.pic{flex-direction:column;align-items:stretch;gap:8px;padding:10px}
.pimg{display:block;border-radius:12px;background:var(--surface-2);overflow:hidden}
.pimg svg{display:block;width:100%;height:auto}
.pcap{display:flex;align-items:center;gap:10px;font-size:1rem;line-height:1.3}
.plate .ln{stroke:var(--icon-line);stroke-width:1.4;stroke-linejoin:round}

/* Narrador da receita */
.narr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px}
.narr .chip{display:inline-flex;align-items:center;gap:6px;min-height:40px}
.narr .chip svg{width:16px;height:16px}
.narrst{font-weight:700;color:var(--ink-soft);font-size:.92rem}
.scene .mouth{transform-box:fill-box;transform-origin:50% 0}
.scene.talking .mouth{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.35)}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const QA=[
  {id:1,cat:'roda',q:'O que é a Roda dos Alimentos?',a:'É um guia em forma de círculo que nos mostra como comer bem. Está dividida em 7 grupos de alimentos: os grupos maiores são os que devemos comer em maior quantidade e os mais pequenos os que devemos comer em menor quantidade. A água está no centro porque faz parte de todos os grupos e devemos bebê-la todos os dias.',k:['roda','circulo','guia']},
  {id:2,cat:'roda',q:'Quais são os grupos da Roda dos Alimentos?',a:'São 7: cereais, derivados e tubérculos (pão, arroz, massa, batata); hortícolas; fruta; laticínios; carne, pescado e ovos; leguminosas; e gorduras e óleos. Cada grupo dá ao corpo coisas diferentes, por isso precisamos de todos.',k:['grupo','sete','7 grupos']},
  {id:3,cat:'roda',q:'O que é uma alimentação completa, equilibrada e variada?',a:'Completa: comer alimentos de todos os grupos todos os dias. Equilibrada: comer mais dos grupos maiores e menos dos grupos mais pequenos. Variada: ir trocando os alimentos dentro de cada grupo, por exemplo, maçã num dia e laranja no outro.',k:['complet','equilibr','variad','variedade']},
  {id:4,cat:'fruta',q:'Porque devemos comer fruta?',a:'Porque a fruta fornece vitaminas, minerais, água e fibra. Comer frutas variadas, várias vezes ao dia, ajuda-nos a ter uma alimentação equilibrada!',k:['fruta$','frutas','fruto']},
  {id:5,cat:'fruta',q:'Porque devemos comer sopa e legumes?',a:'Os hortícolas, como a cenoura, a couve ou o tomate, dão vitaminas, minerais e fibra. A fibra ajuda o intestino a funcionar bem e as vitaminas ajudam a proteger o corpo. Uma sopa de legumes ao almoço e ao jantar é uma ótima maneira de os comer!',k:['sopa','legume','hortic','vegeta','couve','cenoura','brocolo','salada','alface']},
  {id:6,cat:'fruta',q:'É melhor comer a fruta inteira ou beber sumo?',a:'A fruta inteira é melhor! Tem toda a fibra, que nos deixa saciados durante mais tempo. No sumo, mesmo natural, perde-se parte da fibra e o açúcar fica mais concentrado. Os sumos de pacote, muitas vezes, ainda têm açúcar adicionado.',k:['sumo','inteira','natural']},
  {id:7,cat:'fruta',q:'Porque devemos comer fruta da época?',a:'A fruta da época amadurece no tempo certo, por isso é mais saborosa e nutritiva. Costuma ser mais barata e vir de mais perto, o que também é bom para o ambiente. No outono, por exemplo, temos maçã, pera, uvas, romã e dióspiro.',k:['fruta da epoca','epoca','estacao','outono','inverno','verao','primavera']},
  {id:8,cat:'agua',q:'Devemos beber água ou refrigerantes?',a:'Água! É a melhor bebida para matar a sede e não tem açúcar. Os refrigerantes têm muito açúcar (uma só lata pode ter várias colheres de chá), fazem mal aos dentes e não fazem parte da Roda dos Alimentos.',k:['refrigerante','coca','gasosa','ice tea','refresco','agua ou']},
  {id:9,cat:'agua',q:'Quanta água devemos beber por dia?',a:'Cerca de 6 a 8 copos por dia, bebidos aos poucos ao longo do dia. Quando está calor ou fazemos desporto, precisamos de mais. Não esperes pela sede: ter sede já é um sinal de que o corpo precisa de água.',k:['quanta agua','copos','litro','sede','hidrat','beber agua','agua$']},
  {id:10,cat:'refeicoes',q:'Porque é importante tomar o pequeno-almoço?',a:'Durante a noite passamos muitas horas sem comer. O pequeno-almoço dá energia ao corpo e ao cérebro para começar o dia e ajuda-nos a estar atentos nas aulas. Um bom exemplo: leite ou iogurte, pão e uma peça de fruta.',k:['pequeno almoco','manha','acordar']},
  {id:11,cat:'refeicoes',q:'Quantas refeições devemos fazer por dia?',a:'Normalmente 5 ou 6: pequeno-almoço, meio da manhã, almoço, lanche, jantar e, às vezes, uma ceia leve. O ideal é não passar mais de 3 horas e meia sem comer, para termos sempre energia.',k:['refeic','quantas vezes','horas sem','ceia','jantar','almoco$']},
  {id:12,cat:'refeicoes',q:'O que é um lanche saudável?',a:'É um lanche que junta alimentos de grupos diferentes. Por exemplo: pão com queijo, uma peça de fruta e água. Ou um iogurte natural com fruta. Bolachas recheadas, batatas fritas de pacote e refrigerantes ficam para ocasiões especiais.',k:['lanche','lancheira','merenda','intervalo','recreio']},
  {id:13,cat:'crescer',q:'Para que servem o leite e o iogurte?',a:'Os laticínios, como o leite, o iogurte e o queijo, têm cálcio e proteínas. O cálcio ajuda a construir ossos e dentes fortes, o que é muito importante enquanto estás a crescer.',k:['leite','iogurte','queijo','calcio','osso','laticinio','lacticinio']},
  {id:14,cat:'crescer',q:'O que são leguminosas?',a:'São o feijão, o grão-de-bico, as lentilhas, as ervilhas e as favas. Dão proteína, fibra e ferro, e podem substituir a carne ou o peixe em algumas refeições. Também ficam ótimas na sopa!',k:['leguminos','feijao','grao','lentilha','ervilha','fava']},
  {id:15,cat:'crescer',q:'Porque devemos comer peixe?',a:'O peixe tem proteínas que ajudam a crescer e a formar músculos. Os peixes gordos, como a sardinha e a cavala, têm ómega-3, uma gordura boa para o cérebro e para o coração. Devemos ir alternando carne e peixe nas refeições.',k:['peixe','sardinha','pescado','omega','carne','atum','salmao','bacalhau','proteina']},
  {id:16,cat:'moderar',q:'Podemos comer doces?',a:'Podemos, mas só de vez em quando e em pouca quantidade, por exemplo numa festa de anos. Os doces não fazem parte da Roda dos Alimentos e o açúcar em excesso faz mal aos dentes e à saúde. E depois, lava os dentes!',k:['doce','acucar','chocolate','goma','bolo','rebucado','gelado','bolacha']},
  {id:17,cat:'moderar',q:'Porque não devemos comer muito sal?',a:'O sal em excesso pode fazer mal ao coração, sobretudo quando formos mais velhos. Há muito sal escondido em batatas fritas de pacote, salgados, enchidos e comida rápida. Para dar sabor, podemos usar ervas aromáticas, como a salsa, os coentros ou os orégãos.',k:['sal$','salgad','enchido','chourico','presunto','tremoco']},
  {id:18,cat:'moderar',q:'A comida rápida (fast food) faz mal?',a:'Hambúrgueres, pizzas e batatas fritas costumam ter muita gordura, sal e açúcar, e pouca fibra e vitaminas. Comer de vez em quando não faz mal, mas não deve ser todos os dias. Em casa, podemos fazer versões mais saudáveis!',k:['fast food','fast','hamburguer','pizza','mcdonald','comida rapida','batatas fritas','nuggets','kebab']},
  {id:19,cat:'detetive',q:'Como posso ler o rótulo de um alimento?',a:'Na lista de ingredientes, o primeiro ingrediente é o que existe em maior quantidade. Se o açúcar aparece entre os primeiros, aquele alimento tem muito açúcar. Atenção aos nomes escondidos do açúcar: xarope de glicose, frutose ou dextrose!',k:['rotulo','embalagem','ingrediente','etiqueta','ler$']},
  {id:20,cat:'detetive',q:'Posso acreditar em tudo o que vejo na internet sobre comida?',a:'Não! Na internet há informação errada e anúncios que só querem vender. Confirma sempre com um adulto de confiança, como os teus pais, o professor ou um nutricionista. Até as respostas de aplicações podem ter erros, por isso pensa sempre de forma crítica.',k:['internet','youtube','tiktok','instagram','acreditar','verdade','redes sociais','inteligencia artificial','ia$','chatgpt','anuncio','publicidade','google']}

const SHELF=['maca','bolachas','pao','agua','refri','queijo','cenoura','gomas','iogurte','banana','batatas','ovo','tangerina','sumo','aveia','humus','tomate','bolo','leite','manteiga'];

const STEPS=[
  {id:'quiz',n:1,title:'O que já sabes?',sub:'Quiz inicial',desc:'6 perguntas para começar',color:'var(--g-laticinios)',icon:TI.quiz},
  {id:'perguntas',n:2,title:'Pergunta ao NutriBot',sub:'Dúvidas e respostas',desc:'20 perguntas sobre alimentação',color:'var(--g-horticolas)',icon:TI.chat},
  {id:'lanche',n:3,title:'Constrói o teu lanche',sub:'Desafio interativo',desc:'Monta um lanche equilibrado',color:'var(--g-fruta)',icon:TI.box},
  {id:'final',n:4,title:'O que aprendeste?',sub:'Avaliação final',desc:'Mostra o que aprendeste',color:'var(--g-cereais)',icon:TI.medal}
];

/* ---------- Estado ---------- */
function fresh(){return {v:1,done:{quiz:false,perguntas:false,lanche:false,final:false},quizScore:null,quizRes:null,explored:[],lanche:[],reasons:{},final:null,festa:[],narr:false,big:false};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return Object.assign(fresh(),s);}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=load();
let cur='inicio';
let chat=[],cat='todas',busy=false,typing=false;
let fin={};

/* ---------- Utilitários ---------- */
let spTok=0,spTimer=null,spQ=[];
function talk(on){const sc=document.getElementById('scene');if(sc)sc.classList.toggle('talking',!!on);}
function stopSpeech(){spTok++;clearTimeout(spTimer);spQ=[];try{window.speechSynthesis.cancel();}catch(e){}talk(false);}
function speak(t,done){
  stopSpeech();const my=spTok;
  const fin=()=>{if(my!==spTok)return;spTok++;clearTimeout(spTimer);spQ=[];talk(false);if(done)done();};
  const txt=String(t).replace(/[«»]/g,'');
  setTimeout(()=>{
    if(my!==spTok)return;
    try{
      const s=window.speechSynthesis,vs=s.getVoices(),v=vs.find(x=>/pt[-_]PT/i.test(x.lang))||vs.find(x=>/^pt/i.test(x.lang));
      const parts=(txt.match(/[^.!?:]+[.!?:]*/g)||[txt]).map(p=>p.trim()).filter(Boolean);
      parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang='pt-PT';u.rate=.95;if(v)u.voice=v;u.onerror=fin;if(i===parts.length-1)u.onend=fin;spQ.push(u);s.speak(u);});
      talk(true);
    }catch(e){}
  },60);
  spTimer=setTimeout(fin,Math.max(4000,txt.length*110+3000));
}
const sayBtn=t=>canSpeak?`<button class="say" data-say="${esc(t)}" aria-label="Ouvir em voz alta" title="Ouvir">${ICON.speaker}</button>`:'';
const vhead=(k,t)=>`<div class="vhead"><button class="back" data-go="inicio">${ICON.back}Início</button><div><span class="kicker">${k}</span><h1>${t}</h1></div></div>`;
const conceptList=res=>`<ul class="concepts">${(res||[]).map(r=>`<li class="${r.ok?'ok':'no'}">${r.ok?ICON.check:ICON.x}<span>${r.c}</span></li>`).join('')}</ul>`;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();

function match(text){
  const t=' '+norm(text)+' ';const words=t.trim().split(' ');
  let best=null,bs=0;
  for(const q of QA){
    let s=0;
    for(const k of q.k){
      if(k.endsWith('$')){if(words.includes(k.slice(0,-1)))s+=k.length-1;}
      else if(k.includes(' ')){if(t.includes(' '+k))s+=k.length;}
      else if(words.some(w=>w.startsWith(k)))s+=k.length;
    }
    if(s>bs){bs=s;best=q;}
  }
  return best;
}

function pips(){
  document.getElementById('pips').innerHTML=STEPS.map(s=>{const d=state.done[s.id];return `<button class="pip ${d?'done':''} ${cur===s.id?'cur':''}" data-go="${s.id}" aria-label="Etapa ${s.n}: ${s.title}${d?' (feita)':''}" title="${s.title}">${d?ICON.check:s.n}</button>`;}).join('');
}
function go(name){
  cur=name;view.onclick=null;stopMw();stopPlay();stopSpeech();
  const V={inicio:vInicio,quiz:()=>vQuiz(false),perguntas:vPerguntas,lanche:vLanche,final:()=>vFinal(false),festa:vFesta,cozinha:vCozinha};
  (V[name]||vInicio)();
  pips();window.scrollTo(0,0);
  const h=view.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}
}

/* ---------- Início ---------- */

    :'Fizeste as quatro etapas. Parabéns! Podes ver o teu resumo em «O que aprendeste?».';

  <section class="hero"><div class="hero-bot">${ROBOT}</div><div class="speech"><p>${msg}</p>${sayBtn(msg)}</div></section>
  <div class="tiles">${STEPS.map(s=>{const d=state.done[s.id],nx=next&&next.id===s.id;return `<button class="tile ${d?'done':''} ${nx?'next':''}" data-go="${s.id}" style="--t:${s.color}">
    <span class="ticon">${s.icon}</span>
    <span class="ttext"><small>Etapa ${s.n} · ${s.sub}</small><b>${s.title}</b><span>${s.desc}</span></span>
    <span class="tstat">${d?ICON.check+'Feito':nx?'Começar':'Por fazer'}</span></button>`;}).join('')}</div>
  <div class="xhead"><h2>Extras</h2><p>Para explorar no fim da aula ou em casa, com a família.</p></div>
  <div class="tiles">${EXTRAS.map(x=>`<button class="tile extra" data-go="${x.id}" style="--t:${x.color}"><span class="ticon">${x.icon}</span><span class="ttext"><small>${x.sub}</small><b>${x.title}</b><span>${x.desc}</span></span><span class="tstat">Abrir${ICON.arrow}</span></button>`).join('')}</div>
  <footer class="foot">
    <p><b>Como funciona o NutriBot:</b> todas as respostas foram escritas e verificadas pelo grupo, com base na Roda dos Alimentos da Direção-Geral da Saúde. O NutriBot não usa inteligência artificial em tempo real: só responde com respostas preparadas e não pede dados pessoais. Em caso de dúvida, pergunta a um adulto.</p>
    <button class="link" data-reset>Recomeçar para outro aluno</button>
  </footer>`;
}

/* ---------- Motor de quiz ---------- */
function runQuiz(list,meta,onDone){
  let i=0,score=0;const res=[];
  const draw=()=>{
    const q=list[i];
    view.innerHTML=vhead(meta.kicker,meta.title)+`<div class="qcard">
      <div class="qmeta"><span>Pergunta ${i+1} de ${list.length}</span><span class="tag">${q.c}</span></div>
      <div class="bar"><span style="width:${i/list.length*100}%"></span></div>
      <div class="qrow"><h2 id="qt">${q.q}</h2>${sayBtn(q.q+' '+q.o.join('. '))}</div>
      <div class="opts${q.pics?' pics':''}" role="group" aria-labelledby="qt">${q.o.map((t,k)=>q.pics?`<button class="opt pic" data-k="${k}"><span class="pimg">${PLATES[q.pics[k]]}</span><span class="pcap"><span class="key">${'ABCD'[k]}</span><span>${t.replace(/^Prato [A-D]: (.)/,(m,c)=>c.toUpperCase())}</span></span></button>`:`<button class="opt" data-k="${k}"><span class="key">${'ABCD'[k]}</span><span>${t}</span></button>`).join('')}</div>
      <div class="fb" id="fb" hidden aria-live="polite"></div>
      <div class="actions" id="nx" hidden><button class="btn" id="nextb">${i===list.length-1?'Ver resultado':'Seguinte'}${ICON.arrow}</button></div>
    </div>`;
  };
  const answer=k=>{
    const q=list[i],ok=k===q.a;if(ok)score++;res.push({c:q.c,ok});
    view.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');else b.classList.add('dim');});
    const fb=view.querySelector('#fb');fb.hidden=false;fb.className='fb '+(ok?'good':'bad');
    fb.innerHTML=`${ok?'<b>Certo!</b>':`<b>Quase!</b> A resposta certa é ${q.pics?'o prato':'a'} ${'ABCD'[q.a]}.`} ${q.e}`;
    view.querySelector('.bar span').style.width=((i+1)/list.length*100)+'%';
    view.querySelector('#nx').hidden=false;view.querySelector('#nextb').focus();
  };
  view.onclick=e=>{
    const o=e.target.closest('.opt');if(o&&!o.disabled){answer(+o.dataset.k);return;}
    if(e.target.closest('#nextb')){i++;if(i<list.length){draw();view.querySelector('.opt').focus();}else onDone(score,res);}
  };
  draw();
}

/* ---------- Etapa 1: quiz inicial ---------- */
function vQuiz(again){
  if(state.done.quiz&&!again)return quizEnd();
  runQuiz(QUIZ_I,{kicker:'Etapa 1 · Quiz inicial',title:'O que já sabes?'},(score,res)=>{state.quizScore=score;state.quizRes=res;state.done.quiz=true;save();pips();quizEnd();});
}
function quizEnd(){
  const s=state.quizScore;
  const title=s>=5?'Uau, já sabes muito!':s>=3?'Bom começo!':'Vamos aprender juntos!';
  view.innerHTML=vhead('Etapa 1 · Quiz inicial','O que já sabes?')+`<div class="qcard">
    <div class="score"><b>${s}</b><span>de 6 certas</span></div>
    <h2>${title}</h2>
    <p class="mt">Este quiz serve para descobrires o que já sabes. Não faz mal errar: no fim vais ver quanto aprendeste.</p>
    ${conceptList(state.quizRes)}
    <div class="actions"><button class="btn" data-go="perguntas">Pergunta ao NutriBot${ICON.arrow}</button><button class="btn ghost" id="redo">Fazer outra vez</button></div>
  </div>`;
  view.onclick=e=>{if(e.target.closest('#redo'))vQuiz(true);};
}

/* ---------- Etapa 2: perguntas ---------- */
const WELCOME='Olá! Escolhe uma pergunta da lista ou escreve a tua. As minhas respostas foram escritas e verificadas pelo grupo, com base na Roda dos Alimentos.';
function vPerguntas(){
  if(!chat.length)chat.push({who:'bot',text:WELCOME});
  view.innerHTML=vhead('Etapa 2 · Dúvidas e respostas','Pergunta ao NutriBot')+`
  <div class="meter" id="meter"></div>
  <div class="chatwrap">
    <section class="chat" id="chatbox" aria-label="Conversa com o NutriBot">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="askf"><label class="sr" for="ask">Escreve a tua pergunta</label><input id="ask" autocomplete="off" placeholder="Escreve a tua pergunta…" maxlength="120"><button class="btn small" type="submit">Perguntar</button></form>
    </section>
    <aside class="picker" aria-label="Lista de perguntas">
      <h2>Experimenta uma pergunta</h2>
      <div class="chips" id="cats"></div>
      <div class="qlist" id="qlist"></div>
      <p class="note">${QA.length} perguntas preparadas e verificadas pelo grupo.</p>
    </aside>
  </div>`;
  renderLog();renderPicker();renderMeter();
  view.querySelector('#askf').onsubmit=e=>{e.preventDefault();const inp=view.querySelector('#ask');const t=inp.value.trim();if(!t||busy)return;inp.value='';askTyped(t);};
  view.onclick=e=>{
    const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;renderPicker();const b=view.querySelector(`[data-cat="${cat}"]`);if(b)b.focus();return;}
    const q=e.target.closest('[data-q]');if(q){ask(+q.dataset.q);}
  };
}
function chatIntoView(){const box=document.getElementById('chatbox');if(box&&window.matchMedia('(max-width: 820px)').matches){const r=box.getBoundingClientRect();if(r.top<0||r.bottom>window.innerHeight)box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}}
function ask(id,typed){
  if(busy)return;const q=QA.find(x=>x.id===id);busy=true;
  chat.push({who:'user',text:typed||q.q});typing=true;renderLog();chatIntoView();
  setTimeout(()=>{
    typing=false;
    chat.push({who:'bot',tag:CATS[q.cat],lead:typed?`Encontrei esta pergunta: «${q.q}»`:'',text:q.a});
    const before=state.explored.length;
    if(!state.explored.includes(id))state.explored.push(id);
    if(before<3&&state.explored.length>=3){state.done.perguntas=true;chat.push({who:'bot',text:'Boa! Já exploraste 3 perguntas e cumpriste o objetivo desta etapa. Podes continuar a perguntar ou passar ao desafio do lanche.'});pips();}
    save();busy=false;renderLog();renderPicker();renderMeter();
  },reduce?150:750);
}
function askTyped(t){
  const q=match(t);if(q)return ask(q.id,t);
  busy=true;chat.push({who:'user',text:t});typing=true;renderLog();
  setTimeout(()=>{typing=false;chat.push({who:'bot',text:'Ainda não aprendi a responder a essa pergunta. Pede ajuda ao teu professor ou escolhe uma das perguntas da lista.'});busy=false;renderLog();},reduce?150:750);
}
function renderLog(){
  const log=document.getElementById('log');if(!log)return;
  log.innerHTML=chat.map(m=>m.who==='user'?`<div class="msg user">${esc(m.text)}</div>`
    :`<div class="msg bot"><span class="ava">${ROBOT}</span><div class="bubble">${m.tag?`<span class="btag">${m.tag}</span>`:''}${m.lead?`<p class="lead">${m.lead}</p>`:''}<p>${m.text}</p>${sayBtn(m.text)}</div></div>`).join('')
    +(typing?`<div class="msg bot"><span class="ava">${ROBOT}</span><div class="bubble typing" role="status" aria-label="O NutriBot está a escrever"><span></span><span></span><span></span></div></div>`:'');
  log.scrollTop=log.scrollHeight;
}
function renderPicker(){
  const cats=document.getElementById('cats'),list=document.getElementById('qlist');if(!cats)return;
  cats.innerHTML=[['todas','Todas'],...Object.entries(CATS)].map(([k,v])=>`<button class="chip" data-cat="${k}" aria-pressed="${cat===k}">${v}</button>`).join('');
  list.innerHTML=QA.filter(q=>cat==='todas'||q.cat===cat).map(q=>{const s=state.explored.includes(q.id);return `<button class="qbtn ${s?'seen':''}" data-q="${q.id}"><span class="mk">${s?ICON.check:''}</span><span>${q.q}</span></button>`;}).join('');
}
function renderMeter(){
  const m=document.getElementById('meter');if(!m)return;const n=state.explored.length;
  m.innerHTML=`<div class="dots" aria-hidden="true">${[0,1,2].map(i=>`<span class="${i<n?'on':''}"></span>`).join('')}</div>
  <p>${n>=3?`Objetivo cumprido! Exploraste ${n} de ${QA.length} perguntas.`:`Explora pelo menos 3 perguntas · ${n} de 3`}</p>
  ${n>=3?`<button class="btn small" data-go="lanche">Desafio do lanche${ICON.arrow}</button>`:''}`;
}

/* ---------- Etapa 3: lanche ---------- */
function P(r,a){const t=a*Math.PI/180;return [(100+r*Math.cos(t)).toFixed(2),(100+r*Math.sin(t)).toFixed(2)];}
function arc(a1,a2,R,r){const L=(a2-a1)>180?1:0;const [x1,y1]=P(R,a1),[x2,y2]=P(R,a2),[x3,y3]=P(r,a2),[x4,y4]=P(r,a1);return `M${x1} ${y1}A${R} ${R} 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${L} 0 ${x4} ${y4}Z`;}
function wheel(active,water){
  let a=-90,s='';
  for(const g of ORDER){const sw=GROUPS[g].pct*3.6;s+=`<path d="${arc(a+.8,a+sw-.8,94,46)}" style="fill:var(--g-${g})" class="seg ${active.has(g)?'on':''}"><title>${GROUPS[g].name} · ${GROUPS[g].pct}%</title></path>`;a+=sw;}
  s+=`<g class="seg ${water?'on':''}"><title>Água</title><circle cx="100" cy="100" r="40" style="fill:var(--g-agua)"/><path d="M100 79c7 10 12 16 12 23a12 12 0 0 1-24 0c0-7 5-13 12-23z" style="fill:var(--surface)" opacity=".9"/></g>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Roda dos Alimentos: o teu lanche tem ${active.size} de 7 grupos${water?' e água':''}">${s}</svg>`;
}
function lancheStatus(){
  const sel=state.lanche.map(id=>FOOD[id]);
  const groups=new Set(sel.filter(f=>GROUPS[f.g]).map(f=>f.g));
  const water=sel.some(f=>f.g==='agua');
  const occ=sel.filter(f=>f.g==='ocasional');
  return {sel,groups,water,occ,balanced:groups.size>=3&&water&&occ.length===0};
}
function vLanche(){
  view.innerHTML=vhead('Etapa 3 · Desafio interativo','Constrói o teu lanche')+`
  <p class="lede">Monta um lanche para levar para a escola. Escolhe até 5 alimentos. A Roda dos Alimentos acende-se com os grupos que escolheres.</p>
  <div class="lanche">
    <section class="box" aria-labelledby="lb-h">
      <h2 id="lb-h">A tua lancheira <span class="count" id="lcount"></span></h2>
      <div class="slots" id="slots"></div>
      <p class="lnote" id="lnote" role="status" hidden></p>
      <div class="wheelrow"><div class="wheel" id="wheel"></div><ul class="legend" id="legend"></ul></div>
      <ul class="checks" id="checks" aria-live="polite"></ul>
    </section>
    <section class="box" aria-labelledby="sh-h">
      <h2 id="sh-h">Escolhe os alimentos</h2>
      <div class="shelf" id="shelf">${SHELF.map(id=>`<button class="food" data-food="${id}" aria-pressed="false">${fi(id)}<span>${FOOD[id].name}</span><span class="tick">${ICON.check}</span></button>`).join('')}</div>
    </section>
  </div>
  <section class="box just" id="just" hidden></section>`;
  updLanche();
  view.onclick=e=>{
    const f=e.target.closest('[data-food]');if(f){toggleFood(f.dataset.food);return;}
    const r=e.target.closest('[data-rm]');if(r){const id=r.dataset.rm;toggleFood(id);const b=view.querySelector(`[data-food="${id}"]`);if(b)b.focus({preventScroll:true});return;}
    const j=e.target.closest('[data-just]');if(j){const id=j.dataset.just,rr=j.dataset.r;state.reasons[id]=rr;save();updJust();const b=view.querySelector(`[data-just="${id}"][data-r="${rr}"]`);if(b)b.focus();return;}
    if(e.target.closest('#ldone')){state.done.lanche=true;save();pips();updJust();const b=view.querySelector('.win .btn');if(b)b.focus();}
  };
}
function toggleFood(id){
  const i=state.lanche.indexOf(id),note=document.getElementById('lnote');
  if(i>=0){state.lanche.splice(i,1);delete state.reasons[id];note.hidden=true;}
  else if(state.lanche.length>=5){note.hidden=false;note.textContent='A lancheira está cheia! Tira um alimento para pôr outro.';return;}
  else{state.lanche.push(id);note.hidden=true;}
  save();updLanche();
}
function updLanche(){
  const st=lancheStatus();
  document.getElementById('lcount').textContent=`${st.sel.length}/5`;
  document.getElementById('slots').innerHTML=st.sel.map(f=>`<span class="slot full">${fi(f.id)}<span class="nm">${f.name}</span><button class="rm" data-rm="${f.id}" aria-label="Tirar ${f.name}">${ICON.x}</button></span>`).join('')
    +Array.from({length:5-st.sel.length},()=>'<span class="slot" aria-hidden="true">+</span>').join('');
  document.getElementById('wheel').innerHTML=wheel(st.groups,st.water);
  document.getElementById('legend').innerHTML=ORDER.map(g=>`<li class="${st.groups.has(g)?'on':''}"><span class="sw" style="background:var(--g-${g})"></span>${GROUPS[g].short}<span class="pct">${GROUPS[g].pct}%</span></li>`).join('')
    +`<li class="${st.water?'on':''}"><span class="sw" style="background:var(--g-agua)"></span>Água<span class="pct">centro</span></li>`;
  view.querySelectorAll('.food').forEach(b=>{const on=state.lanche.includes(b.dataset.food);b.classList.toggle('sel',on);b.setAttribute('aria-pressed',String(on));});
  const li=(cls,t,sub)=>`<li class="${cls}"><span class="ck">${cls==='ok'?ICON.check:cls==='warn'?ICON.x:''}</span><span><b>${t}</b>${sub?`<small>${sub}</small>`:''}</span></li>`;
  document.getElementById('checks').innerHTML=
    li(st.groups.size>=3?'ok':'','Pelo menos 3 grupos da Roda',`Tens ${st.groups.size} de 3 grupos.`)
    +li(st.water?'ok':'','Água para beber',st.water?'A água é a melhor bebida.':'Junta água à tua lancheira.')
    +(st.occ.length?st.occ.map(f=>li('warn',`${f.name}: ${f.why}.`,f.swap)).join('')
      :li(st.sel.length?'ok':'','Nada para ocasiões especiais','Bolos, gomas e refrigerantes ficam para as festas.'));
  updJust();
}
function updJust(){
  const box=document.getElementById('just');if(!box)return;
  const st=lancheStatus();
  if(!st.balanced){box.hidden=true;box.innerHTML='';return;}
  box.hidden=false;
  let right=0;
  const rows=st.sel.map(f=>{
    const ch=state.reasons[f.id],ok=!!ch&&f.ok.includes(ch);if(ok)right++;
    const hint=f.g==='agua'?'Pista: o que acontece ao teu corpo quando bebes água?':`Pista: este alimento é do grupo «${GROUPS[f.g].name}». O que nos dá este grupo?`;
    const fb=!ch?'':ok?`<p class="jfb good">${ICON.check}<span>${f.fb}</span></p>`:`<p class="jfb bad"><span>Pensa outra vez. ${hint}</span></p>`;
    return `<div class="jrow"><div class="jfood">${fi(f.id)}<span>${f.name}</span></div>
      <div class="jopts" role="group" aria-label="Porque escolheste: ${f.name}?">${REASONS.map(r=>`<button class="chip ${ch===r.id?(ok?'right':'wrong'):''}" data-just="${f.id}" data-r="${r.id}" aria-pressed="${ch===r.id}">${r.label}</button>`).join('')}</div>${fb}</div>`;
  }).join('');
  const won=state.done.lanche&&right>=2;
  box.innerHTML=`<h2>Lanche equilibrado! Agora explica as tuas escolhas</h2>

let ck=1,ckDone=false,mwTimer=null;
const ingHave=new Set();
function stopMw(){if(mwTimer){clearInterval(mwTimer);mwTimer=null;}}
function setMw(sec){
  const t=document.getElementById('mwTime'),d=document.getElementById('mwDome');if(!t)return;
  t.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  if(d)d.style.transform=`scaleY(${(0.12+0.88*(1-sec/120)).toFixed(3)})`;
}
function runMw(){
  stopMw();
  const sc=document.getElementById('scene'),b=document.getElementById('mwgo');if(!sc)return;
  let sec=120;setMw(sec);
  const done=()=>{sc.classList.remove('running');if(b){b.disabled=false;b.textContent='Ligar outra vez';}const n=document.getElementById('mwnote');if(n)n.textContent='Ding! O bolo cresceu e o meio está firme. Agora, deixa arrefecer.';};
  if(reduce){setMw(0);done();return;}
  sc.classList.add('running');if(b){b.disabled=true;b.textContent='A cozinhar…';}
  mwTimer=setInterval(()=>{sec--;setMw(sec);if(sec<=0){stopMw();done();}},70);
}
function vCozinha(){
  ck=1;ckDone=false;
  view.innerHTML=vhead('Extra · Receita animada','Bolo de caneca do Chef NutriBot')+`
  <div class="meta"><span>Preparação: 5 min</span><span>Micro-ondas: 2 min</span><span>Para 1 pessoa</span><span>Sem açúcar adicionado</span></div>
  <div class="ckwrap">
    <div>
      <div class="scenebox">${SCENE}</div>
      ${canSpeak?`<div class="narr"><button class="btn small" id="ckplay"></button><button class="chip" id="ckauto" aria-pressed="${!!state.narr}">${ICON.speaker}<span>Ler cada passo sozinho</span></button><span class="narrst" id="narrst" aria-live="polite"></span></div>`:''}
      <section class="stepcard" aria-labelledby="cktitle">
        <div class="stephead"><span class="kicker" id="ckn"></span><span class="adult" id="ckadult" hidden>${ICON.adult}Com um adulto</span></div>
        <div class="qrow"><h2 id="cktitle"></h2><span id="cksay"></span></div>
        <p id="cktext" aria-live="polite"></p>
        <div id="ckextra"></div>
        <div class="cknav"><button class="btn ghost" id="ckprev">${ICON.back}Anterior</button><div class="ckdots" id="ckdots"></div><button class="btn" id="cknext"></button></div>
      </section>
    </div>
    <aside class="box recipe" aria-labelledby="ing-h">
      <h2 id="ing-h">Ingredientes <span class="count" id="ingc"></span></h2>
      <p class="hint2">Toca em cada ingrediente quando o tiveres na bancada.</p>
      <ul class="ing">${ING.map(i=>`<li><button class="ingb" data-ing="${i.id}" aria-pressed="${ingHave.has(i.id)}"><span class="cbox">${ICON.check}</span>${fi(i.id)}<span>${i.q}</span></button></li>`).join('')}</ul>
      <h3>Utensílios</h3>
      <p class="tools">Uma caneca grande, própria para micro-ondas · um garfo · uma colher de sopa · uma colher de chá</p>
      <div class="warn"><b>Atenção</b><ul>
        <li>O micro-ondas e a caneca quente são sempre com um adulto.</li>
        <li>Usa uma caneca sem partes de metal e enche-a só até meio, porque o bolo cresce.</li>
        <li>Contém ovo e aveia.</li>
      </ul></div>
    </aside>
  </div>
  <section class="box vars" aria-labelledby="var-h"><h2 id="var-h">Experimenta variações</h2>
    <ul class="vlist">
      <li>${fi('maca')}<span><b>Maçã e canela</b>Troca o cacau por 2 colheres de sopa de maçã ralada e mais uma pitada de canela.</span></li>
      <li>${fi('boloanos')}<span><b>Numa festa de anos</b>Cada convidado faz e decora o seu bolo. <button class="link" data-go="festa">Ver ideias para festas</button></span></li>
    </ul>
  </section>`;
  updIng();renderCk();updPlay();
  view.onclick=e=>{
    const g=e.target.closest('[data-ing]');
    if(g){const id=g.dataset.ing;if(ingHave.has(id))ingHave.delete(id);else ingHave.add(id);g.setAttribute('aria-pressed',String(ingHave.has(id)));updIng();return;}
    const d=e.target.closest('[data-ck]');
    if(d){stopPlay();ck=+d.dataset.ck;ckDone=false;renderCk(true);autoRead();return;}
    if(e.target.closest('#ckprev')){stopPlay();if(ckDone)ckDone=false;else if(ck>1)ck--;renderCk();autoRead();return;}
    if(e.target.closest('#cknext')){stopPlay();if(ckDone){ck=1;ckDone=false;}else if(ck<CK.length)ck++;else ckDone=true;renderCk();autoRead();return;}
    if(e.target.closest('#ckplay')){if(playing)stopPlay();else playAll();return;}
    const a=e.target.closest('#ckauto');
    if(a){state.narr=!state.narr;save();a.setAttribute('aria-pressed',String(state.narr));if(state.narr){stopPlay();speakStep();}else if(!playing)stopSpeech();return;}
    if(e.target.closest('#mwgo'))runMw();
  };
}
function updIng(){const c=document.getElementById('ingc');if(c)c.textContent=`${ingHave.size}/${ING.length}`;}
function renderCk(focusDot){
  const sc=document.getElementById('scene');if(!sc)return;
  stopMw();sc.classList.remove('running');sc.setAttribute('data-step',String(ck));
  const s=CK[ck-1];
  const title=ckDone?'Bom apetite, chef!':s.t;
  const text=ckDone?'Fizeste um bolo de caneca sem açúcar adicionado: a banana madura dá o sabor doce. Experimenta as variações aqui em baixo.':s.x;
  view.querySelector('#ckn').textContent=ckDone?'Receita concluída':`Passo ${ck} de ${CK.length}`;
  view.querySelector('#ckadult').hidden=!s.adult||ckDone;
  view.querySelector('#cktitle').textContent=title;
  view.querySelector('#cktext').textContent=text;
  view.querySelector('#cksay').innerHTML=sayBtn(ckDone?FALA_END:FALA[ck-1]);
  view.querySelector('#ckextra').innerHTML=ck===5&&!ckDone?'<div class="mw"><button class="btn small" id="mwgo">Ligar o micro-ondas</button><p class="note" id="mwnote">Simulação rápida. No micro-ondas a sério demora cerca de 2 minutos.</p></div>':'';
  if(ck===5)setMw(120);
  view.querySelector('#ckprev').disabled=ck===1&&!ckDone;
  view.querySelector('#cknext').innerHTML=ckDone?'Fazer outra vez':ck===CK.length?'Concluir'+ICON.check:'Seguinte'+ICON.arrow;
  view.querySelector('#ckdots').innerHTML=CK.map((c,i)=>{const n=i+1,cur=n===ck&&!ckDone;return `<button class="ckdot ${cur?'cur':''} ${n<ck||ckDone?'done':''}" data-ck="${n}" aria-label="Passo ${n}: ${c.t}"${cur?' aria-current="step"':''}>${n}</button>`;}).join('');
  if(focusDot){const d=view.querySelector(`[data-ck="${ck}"]`);if(d)d.focus();}
}

/* Narrador: ouvir a receita toda, passo a passo */
let playing=false,playTimer=null;
function setSt(t){const e=document.getElementById('narrst');if(e)e.textContent=t;}
function updPlay(){const b=document.getElementById('ckplay');if(!b)return;b.innerHTML=playing?ICON.stop+'Parar':ICON.play+'Ouvir a receita toda';b.classList.toggle('ghost',playing);}
function stopPlay(){if(!playing)return;playing=false;clearTimeout(playTimer);stopSpeech();updPlay();setSt('');}
function speakStep(){speak(ckDone?FALA_END:FALA[ck-1]);}
function autoRead(){if(state.narr)speakStep();else stopSpeech();}
function playAll(){
  playing=true;updPlay();ck=1;ckDone=false;renderCk();
  setSt('O Chef NutriBot está a apresentar os ingredientes…');
  speak(FALA_INTRO,()=>{if(playing)playTimer=setTimeout(playStep,700);});
}
function playStep(){
  if(!playing)return;
  renderCk();if(ck===5)runMw();
  setSt(`A explicar o passo ${ck} de ${CK.length}…`);
  speak(FALA[ck-1],()=>{
    if(!playing)return;
    playTimer=setTimeout(()=>{
      if(!playing)return;
      if(ck<CK.length){ck++;playStep();}
      else{ckDone=true;playing=false;updPlay();renderCk();setSt('');speak(FALA_END);}
    },ck===5?2000:1200);
  });
}

/* ---------- Global ---------- */
function handleReset(b){
  if(!b.classList.contains('armed')){
    b.classList.add('armed');b.dataset.label=b.textContent;b.textContent='Tens a certeza? Toca outra vez para apagar o progresso';
    setTimeout(()=>{if(b.isConnected&&b.classList.contains('armed')){b.classList.remove('armed');b.textContent=b.dataset.label;}},4000);return;
  }
  const big=state.big;state=fresh();state.big=big;chat=[];cat='todas';fin={};save();go('inicio');
}
document.addEventListener('click',e=>{
  const s=e.target.closest('.say');if(s){stopPlay();speak(s.dataset.say);return;}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const r=e.target.closest('[data-reset]');if(r){handleReset(r);}
});
const aa=document.getElementById('aa');
function applyBig(){document.documentElement.classList.toggle('big',!!state.big);aa.setAttribute('aria-pressed',String(!!state.big));}
aa.addEventListener('click',()=>{state.big=!state.big;save();applyBig();});
document.getElementById('brandbot').innerHTML=ROBOT;
applyBig();
const h=(location.hash||'').slice(1);
go(['quiz','perguntas','lanche','final','festa','cozinha'].includes(h)?h:'inicio');
})();
</script>
